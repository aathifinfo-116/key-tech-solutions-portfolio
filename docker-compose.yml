# =============================================================================
# Key Tech Solutions - local development stack
#
# Values come from .env; nothing is hardcoded. Copy .env.example to .env and
# fill it in first. Migrations are NEVER run automatically by a container:
# run them yourself with `pnpm prisma:migrate` (development) or
# `pnpm prisma:migrate:deploy` (deployed environments).
# =============================================================================

name: key-tech-solutions

services:
  postgres:
    image: postgres:16-alpine
    container_name: kts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      # Enforce password auth even for local connections.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      # Bound to loopback only: the database is not exposed on the network.
      - '127.0.0.1:${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: kts-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4010
      # Inside the compose network the database host is the service name.
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public
      DATABASE_DIRECT_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4010}
      PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3010}
      ADMIN_SITE_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3011}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010,http://localhost:3011}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/uploads
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:4010/api/v1/media/file}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-Key Tech Solutions <no-reply@example.invalid>}
      MAIL_NOTIFY_TO: ${MAIL_NOTIFY_TO:-}
    ports:
      - '127.0.0.1:4010:4010'
    volumes:
      # Uploads live outside the image so a rebuild never discards them.
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  public-web:
    build:
      context: .
      dockerfile: docker/public-web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3010}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Key Tech Solutions}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4010}
    container_name: kts-public-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      # Server-side calls go over the compose network, not the public URL.
      API_INTERNAL_URL: http://api:4010
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4010}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3010}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Key Tech Solutions}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    ports:
      - '127.0.0.1:3010:3010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin-web:
    build:
      context: .
      dockerfile: docker/admin-web.Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3011}
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:4010}
    container_name: kts-admin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      HOSTNAME: 0.0.0.0
      ADMIN_INTERNAL_API_URL: http://api:4010
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:4010}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3011}
    ports:
      - '127.0.0.1:3011:3011'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3011/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
    name: kts-postgres-data
