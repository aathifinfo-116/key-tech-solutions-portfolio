packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies permitted to run install scripts (native/engine downloads).
# pnpm >= 12 reads this map; older pnpm reads onlyBuiltDependencies below.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  bcrypt: true
  '@nestjs/core': true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - 'esbuild'
  - 'sharp'
  - 'bcrypt'
  - '@nestjs/core'
